      tags:
      - reviews
    post:
      consumes:
      - application/json
      operationId: createReview
      parameters:
      - description: restaurant id
        in: path
        name: id
        required: true
        type: string
      - description: คะแนน 1–5 + ข้อความ
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/review.ReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/review.ReviewResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
