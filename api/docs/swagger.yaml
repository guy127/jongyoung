      - description: restaurant id
        in: path
        name: id
        required: true
        type: string
      - description: URL รูป
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/restaurant.ImageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/restaurant.ImageResponse'
      security:
      - BearerAuth: []
      summary: เพิ่มรูปร้าน (URL)
      tags:
      - restaurants
  /restaurants/{id}/images/{imageId}:
    delete:
      operationId: deleteRestaurantImage
      parameters:
      - description: restaurant id
        in: path
        name: id
        required: true
