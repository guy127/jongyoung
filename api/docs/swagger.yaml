      - reviews
    get:
      operationId: listReviews
      parameters:
      - description: restaurant id
        in: path
        name: id
        required: true
        type: string
      - description: หน้า
        in: query
        name: page
        type: integer
      - description: จำนวนต่อหน้า
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
