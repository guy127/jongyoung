      - description: image id
        in: path
        name: imageId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ลบรูปร้าน (ห้ามลบรูปสุดท้าย)
      tags:
      - restaurants
  /restaurants/{id}/next-available:
    get:
      operationId: getNextAvailable
