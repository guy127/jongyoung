# ธีมหน้า login ของจองยัง — ต่อยอดจากธีมมาตรฐาน keycloak.v2 (PatternFly 5)
# เปลี่ยนแค่ CSS ไม่ได้ก๊อป template (.ftl) มาแก้ → อัปเกรด Keycloak แล้วหน้า login ไม่พัง
parent=keycloak.v2
import=common/keycloak

# styles.css มาจากธีมแม่ (หาไฟล์ตามลำดับ theme chain) แล้วทับด้วย jongyoung.css ของเรา
styles=css/styles.css css/jongyoung.css

# ตาม prefers-color-scheme ของเครื่อง (ธีมแม่ใส่ class pf-v5-theme-dark ให้)
darkMode=true
