    post:
      consumes:
      - application/json
      operationId: createClosure
      parameters:
      - description: restaurant id
        in: path
        name: id
        required: true
        type: string
      - description: ช่วงปิด
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/restaurant.ClosureRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/restaurant.ClosureResponse'
        "400":
          description: INVALID_CLOSURE
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: CLOSURE_AFFECTS_BOOKINGS
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ปิดร้านชั่วคราว (บางช่วงของวัน หรือทั้งวัน/หลายวัน) — ทับการจองต้องยืนยันด้วย
        confirm_booking_ids
