# รันทั้งระบบ:  cp .env.example .env && docker compose up -d --build
# เปิด http://jongyoung.localhost (web), http://api.jongyoung.localhost/healthz (api),
#     http://keycloak.jongyoung.localhost (keycloak)
name: jongyoung

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # เผื่อต่อจากเครื่องด้วย psql/DBeaver และให้ `go run` นอก docker ใช้ได้
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # ให้ Keycloak ออก issuer เป็นโดเมนกลางเสมอ ไม่ว่าใครเรียก (browser หรือ container)
      KC_HOSTNAME: http://keycloak.jongyoung.localhost
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # ธีมหน้า login (start-dev ไม่ cache ธีม → แก้ CSS แล้ว refresh เห็นผลทันที)
      - ./keycloak/themes/jongyoung:/opt/keycloak/themes/jongyoung:ro

  migrate:
    build: ./api
    # แยก entrypoint/command ให้สั่ง `docker compose run --rm migrate down` หรือ `status` ได้
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # ใส่ข้อมูลตัวอย่างเฉพาะตอนที่ยังไม่มีร้านเลย (รันซ้ำไม่ทับข้อมูล)
  # ล้างแล้วใส่ใหม่:  docker compose run --rm seed --reset
  seed:
    build: ./api
    entrypoint: ["/app/seed"]
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./api
    restart: unless-stopped
    environment:
      APP_ENV: development
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KEYCLOAK_BASE_URL: http://keycloak.jongyoung.localhost
      KEYCLOAK_REALM: jongyoung
      KEYCLOAK_AUDIENCE: jongyoung-api
      CORS_ORIGIN: http://jongyoung.localhost
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api.jongyoung.localhost/api/v1
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: http://jongyoung.localhost
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # ชื่อเดียวกับที่ browser เห็น (ผ่าน alias ของ caddy) → issuer ตรงกับใน token
      KEYCLOAK_ISSUER: http://keycloak.jongyoung.localhost/realms/jongyoung
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # mount ทั้งโฟลเดอร์ (mount ไฟล์เดี่ยวบน WSL/Rancher Desktop พังง่ายเมื่อไฟล์ถูกแก้)
      - ./caddy:/etc/caddy:ro
    networks:
      default:
        aliases:
          # container อื่น (api, web) resolve โดเมนเดียวกับที่ browser ใช้ → วิ่งผ่าน caddy
          - jongyoung.localhost
          - api.jongyoung.localhost
          - keycloak.jongyoung.localhost

  # E2E test (Playwright) — ไม่รันกับ `docker compose up` ปกติ ใช้ `./dev.sh e2e`
  # ต่อเครือข่ายเดียวกับ caddy จึงเรียก *.jongyoung.localhost ได้เหมือน browser จริง
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble # เวอร์ชันต้องตรงกับ @playwright/test ใน e2e/package.json
    environment:
      PROXY_HOST: caddy
      E2E_OUTPUT: /tmp/e2e-results
    volumes:
      - ./e2e:/src:ro # อ่านอย่างเดียว — ติดตั้ง/รันในโฟลเดอร์ชั่วคราวใน container ไม่ทิ้งไฟล์ไว้บนเครื่อง
    # E2E_ARGS ส่งต่อให้ playwright เช่น --project=mobile ($$ = $ ที่ส่งถึง shell ใน container)
    command:
      - sh
      - -c
      - mkdir /work && cp -r /src/package.json /src/package-lock.json /src/playwright.config.ts /src/tests /work
        && cd /work && npm ci --no-audit --no-fund --loglevel=error && npx playwright test $${E2E_ARGS:-}
    depends_on:
      - caddy
      - web

volumes:
  pgdata:
