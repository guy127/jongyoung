      - description: closure id
        in: path
        name: closureId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: เปิดร้านกลับ (ลบช่วงปิด) — การจองที่ยกเลิกไปแล้วไม่ฟื้น
      tags:
      - restaurants
  /restaurants/{id}/images:
